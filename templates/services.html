<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Хирургические операции</title>
    <link rel="stylesheet" href="/static/stiles/services_style.css">
</head>
<body>
    <div class="content">
        <form method="get" action="/services" class="filter-bar">
            <label class="filter-label" for="min-hb">Минимальный Hb до:</label>
            <input id="min-hb" type="number" class="filter-input" name="min_hb" value="{{ .minHb }}" placeholder="Например: 200">
            <button type="submit" class="filter-button">Фильтровать</button>
        </form>
        <div class="patients-list">
            {{ range .operations }}
            <div class="patient-card{{if eq .ID 1}} selected{{end}}">
                <img src="{{ $.mediaURL }}/{{ .Avatar }}" alt="Операция" class="avatar">
                <div class="fio">{{ .Name }}</div>
                <div class="metrics">
                    <div class="metric"><span>Hb до</span> <strong>{{ printf "%.0f" .HbBefore }}</strong></div>
                    <div class="metric"><span>Hb после</span> <strong>{{ printf "%.0f" .HbAfter }}</strong></div>
                </div>
                <div class="card-summary">{{ .Description }}</div>
                <div class="card-actions single-like-only">
                    <button class="like-btn" type="button" aria-label="Поставить лайк" aria-pressed="false">
                        <span class="like-icon" aria-hidden="true">&#9825;</span>
                        <span class="like-count">0</span>
                    </button>
                    <form method="POST" action="/services/delete/{{ .ID }}" class="delete-form">
                        <button class="delete-btn" type="submit">Удалить</button>
                    </form>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
    <nav class="bottom-nav" aria-label="Основная навигация">
        <a href="/order/1" class="nav-btn">Лента</a>
        <a href="/add" class="nav-btn">Добавление</a>
        <a href="/services" class="nav-btn active">Плитка</a>
    </nav>
    <script>
        document.querySelectorAll('.like-btn').forEach(function (button) {
            button.addEventListener('click', function () {
                var liked = button.getAttribute('aria-pressed') === 'true';
                button.setAttribute('aria-pressed', String(!liked));
                button.querySelector('.like-icon').textContent = liked ? '\u2661' : '\u2665';
                button.querySelector('.like-count').textContent = liked ? '0' : '1';
                button.classList.toggle('liked', !liked);
            });
        });
    </script>
</body>
</html>
